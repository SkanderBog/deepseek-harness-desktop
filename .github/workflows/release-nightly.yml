name: Build & Release (Nightly)

# 夜间版（dig-node 形态）：滚动发布 main 的每日构建，保留最近 N 天。
# - 版本号固定注入 0.0.0（构建期写入、不入库）：不占用任何正式版号段，也不让 semver 比较
#   把夜间版算成比正式版新；构建身份看 tag 日期与正文里的构建时间、提交。
# - 每次构建只写两个 Release：当日日期 tag（nightly-YYYYMMDD，独立资产）与滚动别名
#   nightly（强制指向本次提交、同步同一批资产），两者都是 pre-release，永不成为 latest。
# - workflow 名称故意**不等于** "Build & Release"：release-bundle.yml 用 workflow_run
#   监听正式流水线，夜间构建不应触发离线捆绑包。
on:
  # UTC 18:00 = 北京时间次日 02:00，构建完正好接上国内早晨。
  # 注意：仓库连续 60 天无活动后 GitHub 会自动停用 schedule 触发器且不会自动恢复，
  # 届时用 `gh workflow enable "Build & Release (Nightly)"` 重新启用。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「main 无新提交即跳过」，强制重新构建
        required: false
        default: false
        type: boolean

# 只有 finalize 需要写权限（建 Release、移动 tag），其余作业一律只读。
permissions:
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false

env:
  # 保留窗口：含当天在内最近 N 天（每日一版即 N 个日期 Release），更早的连 tag 一起删除。
  NIGHTLY_RETAIN_DAYS: '10'

jobs:
  prepare:
    name: Prepare Nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
    steps:
      # 夜间版只代表 main：dispatch 时即使选了别的分支也固定检出默认分支，
      # 避免把特性分支的提交发成当日的日期 tag。
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Plan nightly version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          set -euo pipefail
          source_ref="$(git rev-parse HEAD)"
          date="$(date -u +%Y%m%d)"
          tag="nightly-$date"
          version=0.0.0
          should_build=true

          if [ "$FORCE" != "true" ]; then
            # main 没动就跳过：夜间版的唯一价值是多带出正式版之后的提交，重复构建白烧
            # runner 且会刷新资产名。上一版夜间版的提交 SHA 记在 Release 正文的标记里。
            last_tag="$(gh release list --limit 100 --json tagName -q '.[].tagName' | sed -n 's/^\(nightly-[0-9]\{8\}\)$/\1/p' | sort | tail -1)"
            if [ -n "$last_tag" ]; then
              last_sha="$(gh release view "$last_tag" --json body -q .body | sed -n 's/.*nightly-sha:\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)"
              if [ -n "$last_sha" ] && [ "$last_sha" = "$source_ref" ]; then
                should_build=false
              fi
            fi
          fi

          {
            echo "should_build=$should_build"
            echo "version=$version"
            echo "tag=$tag"
            echo "source_ref=$source_ref"
          } >> "$GITHUB_OUTPUT"

          if [ "$should_build" = false ]; then
            echo "::notice::main 自 $last_tag 以来没有新提交，跳过本次夜间构建"
          else
            echo "::notice::夜间版 $version（tag $tag，提交 $source_ref）"
          fi

  build-macos:
    name: Build macOS Artifacts
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-windows:
    name: Build Windows Artifacts
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-linux:
    name: Build Linux Artifacts
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # 单一 writer：只有三平台全部构建成功才发布，避免出现「半套资产」的夜间版。
  finalize:
    name: Publish Nightly Release
    needs: [prepare, build-macos, build-windows, build-linux]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_build == 'true' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # finalize 未 checkout，gh 无法从 .git 推断仓库，需显式指定。
      GH_REPO: ${{ github.repository }}
      NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
      NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
      NIGHTLY_SHA: ${{ needs.prepare.outputs.source_ref }}
      # 夜间版提示（唯一出处：日期版与滚动别名共用）；变更日志与产物清单由各步骤追加在后面。
      NIGHTLY_NOTICE: |
        > [!WARNING]
        > 🚨 这是专为测试目的创建的**开发构建版本**，不适用于生产环境，也不提供任何稳定性或可靠性保证。
        > 🚨 如发现问题，请直接提交 issue 报告。
    steps:
      # 先 checkout 再取产物：checkout 默认清理工作区，排在下载产物之后会把产物一起删掉。
      - name: Checkout source for changelog
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          find release-assets -type f -print
          [ -n "$(find release-assets -type f -print -quit)" ] || {
            echo '::error::No nightly assets were downloaded'
            exit 1
          }

      - name: Publish dated nightly release
        run: |
          set -euo pipefail
          if ! gh release view "$NIGHTLY_TAG" >/dev/null 2>&1; then
            # 版本号恒为 0.0.0，标题里另带日期：Release 的 published_at 只在 tag 首次创建时
            # 更新，同日重建不会变，日期与正文的构建时间才是新鲜度信号。
            day="${NIGHTLY_TAG#nightly-}"
            gh release create "$NIGHTLY_TAG" --draft --target "$NIGHTLY_SHA" \
              --title "Nightly $NIGHTLY_VERSION (${day:0:4}-${day:4:2}-${day:6:2})" --prerelease
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$NIGHTLY_TAG" "${assets[@]}" --clobber

          # 版本号恒为 0.0.0，同名资产由 --clobber 原地替换；但打包集合变化时（改名、停发某格式）
          # 旧文件覆盖不掉，而客户端的 pick_asset 是「按文件名模式取第一个匹配」，留着会取到旧包。
          new_names="$(cd release-assets && find . -type f -printf '%f\n')"
          gh release view "$NIGHTLY_TAG" --json assets -q '.assets[].name' | while read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" <<< "$new_names" || gh release delete-asset "$NIGHTLY_TAG" "$name" --yes
          done

      # tag 先改指再生成变更日志：changelog 按 tag 算范围，当日 tag 停在旧提交就会漏掉今天的改动；
      # 别名 tag 同样强制移动（release.yml 的同一手法），不删 Release 重建，下载链接不会出现 404 空窗。
      - name: Point nightly tags at this commit
        uses: actions/github-script@v8
        env:
          NIGHTLY_SHA: ${{ needs.prepare.outputs.source_ref }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const sha = process.env.NIGHTLY_SHA;
            for (const ref of ['tags/nightly', `tags/${process.env.NIGHTLY_TAG}`]) {
              try {
                await github.rest.git.updateRef({ ...context.repo, ref, sha, force: true });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha });
              }
            }

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # 使用 lockfile 固定的 changelogithub，避免带写权限 token 时动态执行 registry 包。
      - name: Install changelog dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$NIGHTLY_TAG:refs/tags/$NIGHTLY_TAG"

          # 起点取早于当日的最近一版夜间版 tag（同日重建因此不会算出空范围），一期都没有就退到
          # 最近的正式版 tag，首版能看到「自上次正式版以来的全部改动」。
          from="$(gh release list --limit 100 --json tagName -q '.[].tagName' |
            sed -n 's/^\(nightly-[0-9]\{8\}\)$/\1/p' | sort |
            while read -r t; do
              if [ "$t" \< "$NIGHTLY_TAG" ]; then echo "$t"; fi
            done | tail -1)"
          if [ -z "$from" ]; then
            from="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi

          day="${NIGHTLY_TAG#nightly-}"
          args=(--draft --to "$NIGHTLY_TAG" --name "Nightly $NIGHTLY_VERSION (${day:0:4}-${day:4:2}-${day:6:2})")
          if [ -n "$from" ]; then
            args+=(--from "$from")
            echo "变更日志范围：$from..$NIGHTLY_TAG"
          else
            echo '::warning::找不到变更日志起点，按全部历史生成'
          fi
          # 变更日志是装饰性内容：它失败也不能拖住当天的包。
          pnpm exec changelogithub "${args[@]}" ||
            echo '::warning::changelogithub 生成变更日志失败，Release 只保留产物与提示'

      - name: Append artifacts and notice
        run: |
          set -euo pipefail
          gh release view "$NIGHTLY_TAG" --json body -q .body > release_notes.md

          classify() {
            case "$1" in
              *aarch64*.dmg) echo 'macOS (Apple Silicon)' ;;
              *x64*.dmg) echo 'macOS (Intel)' ;;
              *.msi) echo 'Windows (MSI)' ;;
              *.exe) echo 'Windows (NSIS)' ;;
              *.AppImage) echo 'Linux (AppImage)' ;;
              *.deb) echo 'Linux (deb)' ;;
              *) echo '其他' ;;
            esac
          }

          {
            cat release_notes.md
            echo
            echo '### 📦 Artifacts'
            while read -r name; do
              [ -n "$name" ] || continue
              echo "- **$(classify "$name")**: [${name}](https://github.com/$GH_REPO/releases/download/$NIGHTLY_TAG/${name// /%20})"
            done < <(cd release-assets && find . -type f -printf '%f\n' | sort)
            echo
            echo "$NIGHTLY_NOTICE"
            echo
            # 构建时间必须写进正文：Release 的 published_at 只在 tag 首次创建时更新，
            # 同日重建不会变，只有正文里的时间是真实的构建新鲜度信号。
            echo "提交 \`$NIGHTLY_SHA\` · 构建时间 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "<!-- nightly-sha:$NIGHTLY_SHA -->"
          } > nightly_notes.md

          gh release edit "$NIGHTLY_TAG" --notes-file nightly_notes.md \
            --draft=false --prerelease --latest=false

      - name: Prune nightlies outside the retention window
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-$((NIGHTLY_RETAIN_DAYS - 1)) days" +%Y%m%d)"
          gh release list --limit 100 --json tagName -q '.[].tagName' |
            sed -n 's/^nightly-\([0-9]\{8\}\)$/\1/p' |
            while read -r day; do
              if [ "$day" -lt "$cutoff" ]; then
                echo "pruning nightly-$day"
                gh release delete "nightly-$day" --yes --cleanup-tag
              fi
            done

      - name: Refresh rolling nightly alias
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --draft --target "$NIGHTLY_SHA" \
              --title "Nightly (latest)" --prerelease
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload nightly "${assets[@]}" --clobber

          # 别名只保留最新一版的资产：打包集合变化时旧文件覆盖不掉，会让按文件名取包的客户端选错版本。
          new_names="$(cd release-assets && find . -type f -printf '%f\n')"
          gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" <<< "$new_names" || gh release delete-asset nightly "$name" --yes
          done

          # 别名正文与当日日期版一致，只把下载链接指向别名 tag（永远解析到最新一版）。
          gh release view "$NIGHTLY_TAG" --json body -q .body > alias_notes.md
          {
            echo "> 滚动别名：本页资产始终是最近一版夜间版，本次对应 [\`$NIGHTLY_TAG\`](https://github.com/$GH_REPO/releases/tag/$NIGHTLY_TAG)。"
            echo
            sed "s|/download/$NIGHTLY_TAG/|/download/nightly/|g" alias_notes.md
          } > nightly_alias_notes.md
          gh release edit nightly --notes-file nightly_alias_notes.md \
            --draft=false --prerelease --latest=false
