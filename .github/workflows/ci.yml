name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build isolated shared packages
        run: pnpm --filter dsh-tauri build && pnpm --filter dsh-tauri-ui build
      - name: Lint changed source and regression tests
        run: pnpm exec eslint packages/dsh-tauri-archive/src/host/service/session.utils.ts packages/dsh-tauri-archive/src/host/service/session.safety.test.ts
      - name: Five fresh shuffled archive suites
        shell: bash
        run: |
          for seed in 901 902 903 904 905; do
            node node_modules/vitest/vitest.mjs run --project unit packages/dsh-tauri-archive/src --maxWorkers=1 --sequence.shuffle --sequence.seed=$seed || exit 1
          done
      - name: Prove regression tests reject the old implementation
        shell: bash
        run: |
          git show c30addc52c115c5874252f5c920fbe11151ce10d:packages/dsh-tauri-archive/src/host/service/session.utils.ts > packages/dsh-tauri-archive/src/host/service/session.utils.ts
          set +e
          node node_modules/vitest/vitest.mjs run --project unit packages/dsh-tauri-archive/src/host/service/session.safety.test.ts --maxWorkers=1 > regression-red.log 2>&1
          result=$?
          set -e
          cat regression-red.log
          test "$result" -ne 0
          grep -q 'AssertionError' regression-red.log
