name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise actual archive module in disposable directories
        working-directory: audit/848
        shell: bash
        run: |
          for run in 1 2 3 4 5; do
            cargo run --quiet || exit 1
          done
