name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust-test:
    name: Rust tests
    strategy:
      fail-fast: false
      matrix:
        # Linux 用与 release workflow 相同的 ubuntu-22.04 + 同一套 apt 包，
        # 保证首次跑 CI 就能编译（tauri 的 webkit/appindicator 原生依赖对齐已知可用环境）。
        # macOS 用官方矩阵的 macos-14（Apple Silicon）。
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-xcode

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 同上：PR 只读缓存，避免每轮生成新条目挤掉 main 的暖缓存。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Windows native notification tests
        if: runner.os == 'Windows'
        run: cargo test -p tauri-plugin-notifications --lib --no-default-features --locked
        working-directory: src-tauri

      - name: Run tests
        run: cargo test --all-features --locked
        working-directory: src-tauri

      - name: Repeat recovery tests five times
        shell: bash
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3 4 5; do
            cargo test --all-features --locked service::backup::recovery::tests -- --test-threads=1
          done

