name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-platforms:
    name: Worktree cleanup safety
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dsh-tauri build
      - name: Repeat cleanup regressions on native filesystems
        shell: bash
        run: |
          for seed in 701 702 703 704 705; do
            node node_modules/vitest/vitest.mjs run --project unit packages/dsh-tauri-worktree/src/host/service/worktree-safety.test.ts packages/dsh-tauri-worktree/src/host/service/worktree.test.ts packages/dsh-tauri-worktree/src/host/routes/index.test.ts --maxWorkers=1 --sequence.shuffle --sequence.seed=$seed || exit 1
          done
